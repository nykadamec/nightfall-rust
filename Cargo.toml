[workspace]
resolver = "2"
members = [
    "crates/nightfall-data",
    "crates/nightfall-game",
    "crates/nightfall-editor",
]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
